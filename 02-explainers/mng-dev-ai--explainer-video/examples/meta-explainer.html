<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Explainer Skill</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --ink: #f0f0f0;
    --muted: #777;
    --line: rgba(255,255,255,0.08);
    --green: #00ff88;
    --cyan: #00b8ff;
    --pink: #ff4d8d;
    --orange: #ffb347;
    --purple: #b388ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px; height: 720px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Inter", "Helvetica Neue", sans-serif;
    overflow: hidden; position: relative;
  }
  .mono { font-family: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace; }

  /* Backdrop layers */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 80px 80px;
    opacity: 0.45;
  }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 4px);
    mix-blend-mode: lighten;
  }
  .edge-frame { position: absolute; inset: 28px; border: 1px solid var(--line); pointer-events: none; }
  .corner {
    position: absolute; width: 18px; height: 18px;
    border: 2px solid var(--green); pointer-events: none;
  }
  .corner.tl { top: 22px; left: 22px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 22px; right: 22px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 22px; left: 22px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 22px; right: 22px; border-left: 0; border-top: 0; }

  /* Top bar */
  .topbar {
    position: absolute; top: 50px; left: 70px; right: 70px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--muted); z-index: 50;
  }
  .topbar .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); margin-right: 12px; vertical-align: middle;
    animation: rec 1.6s ease-in-out infinite;
  }
  @keyframes rec { 50% { opacity: 0.4; } }

  .progress-track {
    position: absolute; bottom: 50px; left: 70px; right: 70px;
    height: 2px; background: var(--line);
  }
  .progress-fill { height: 100%; width: 0%; background: var(--green); }

  /* Stage */
  .stage {
    position: absolute; top: 110px; bottom: 110px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 100px;
    opacity: 0; pointer-events: none;
  }
  .scene.active { opacity: 1; }

  /* Typography */
  .headline {
    font-size: 76px; font-weight: 500; line-height: 1.05;
    letter-spacing: -2.5px; text-align: center;
  }
  .headline.small { font-size: 56px; }
  .headline.tiny { font-size: 36px; letter-spacing: -1px; }
  .headline .w { display: inline-block; }
  .green { color: var(--green); }
  .cyan { color: var(--cyan); }
  .pink { color: var(--pink); }
  .orange { color: var(--orange); }
  .purple { color: var(--purple); }
  .muted { color: var(--muted); }

  .subhead {
    font-size: 22px; color: var(--muted); margin-top: 24px;
    line-height: 1.4; text-align: center; max-width: 820px;
  }
  .caption {
    font-size: 12px; letter-spacing: 5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 28px;
  }

  /* Step layout */
  .step-row {
    display: flex; align-items: center; gap: 36px;
    width: 100%; max-width: 920px;
  }
  .step-num {
    font-size: 112px; font-weight: 500; line-height: 0.9;
    min-width: 140px; font-feature-settings: "tnum";
    letter-spacing: -3px;
  }
  .step-body { border-left: 2px solid var(--line); padding: 10px 0 10px 36px; }
  .step-title { font-size: 46px; font-weight: 500; letter-spacing: -1.2px; margin-bottom: 10px; line-height: 1.1; }
  .step-desc { font-size: 19px; color: var(--muted); line-height: 1.5; }

  .codeblock {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 32px; font-size: 17px; line-height: 1.7;
    width: 100%; max-width: 700px; text-align: left;
    margin-top: 28px;
  }
  .codeblock .k { color: var(--pink); }
  .codeblock .s { color: var(--green); }
  .codeblock .c { color: var(--muted); }
  .cursor {
    display: inline-block; width: 11px; height: 22px;
    background: currentColor; vertical-align: text-bottom; margin-left: 3px;
    animation: blink 0.9s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Pills */
  .pill-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 36px; }
  .pill {
    padding: 14px 28px; border: 1.5px solid currentColor;
    border-radius: 999px;
    font-size: 22px; font-weight: 500; letter-spacing: 0.3px;
  }

  /* Soundwave */
  .wave { display: flex; align-items: center; gap: 5px; height: 90px; margin-top: 36px; }
  .wave .bar { width: 5px; background: var(--pink); border-radius: 3px; }

  /* Pipeline */
  .pipe { display: flex; align-items: center; gap: 12px; margin-top: 36px; }
  .pipe .node {
    border: 1.5px solid var(--line); border-radius: 10px;
    padding: 14px 20px; font-size: 13px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--muted);
    background: var(--panel); font-family: "SF Mono", monospace;
  }
  .pipe .arr { font-size: 22px; color: var(--orange); }

  /* Topic preview cards (the "fresh design" proof) */
  .preview-row { display: flex; gap: 20px; margin-top: 32px; }
  .preview {
    width: 230px; height: 140px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    position: relative; overflow: hidden;
  }
  .preview .label {
    position: absolute; top: 10px; left: 12px;
    font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--muted);
  }
  .preview .name {
    font-size: 18px; font-weight: 500;
    margin-top: 16px;
  }
  .preview svg { width: 90px; height: 70px; }

  /* Agent chip list */
  .logo-row { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 36px; }
  .logo-chip {
    padding: 14px 26px; border: 1.5px solid var(--line); border-radius: 12px;
    font-size: 20px; font-weight: 500; color: var(--ink);
    font-family: "SF Mono", "JetBrains Mono", monospace;
    letter-spacing: -0.3px;
  }

  /* URL stripe for CTA */
  .url-stripe {
    display: inline-block; margin-top: 32px;
    padding: 14px 28px;
    border: 1.5px solid var(--green);
    border-radius: 8px;
    font-family: "SF Mono", monospace;
    font-size: 22px;
    color: var(--green);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="scanlines"></div>
  <div class="edge-frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div class="topbar">
    <div><span class="dot"></span>EXPLAINER.SKILL · REC</div>
    <div id="topright" class="mono">SCENE 01 / 10</div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="progress-track"><div class="progress-fill" id="progress"></div></div>

<script>
  const SEG = window.__SEGMENT_DURATIONS || Array(10).fill((window.__AUDIO_DURATION || 60) / 10);
  const TOTAL = SEG.reduce((a,b)=>a+b, 0);

  const stage = document.getElementById('stage');
  const topright = document.getElementById('topright');
  const progressEl = document.getElementById('progress');
  const splitWords = s => s.split(' ').map(w => '<span class="w">' + w + '</span>').join(' ');
  const pad = n => String(n).padStart(2,'0');

  const scenes = [
    // 0 — Hook: bold, kinetic
    (root) => {
      root.innerHTML = `
        <div class="caption">// generated locally</div>
        <div class="headline">${splitWords('This video was generated by')}</div>
        <div class="headline green" style="margin-top:12px; font-size:88px;">Claude.</div>
        <div class="headline tiny muted" style="margin-top:24px; font-size:32px;">On your laptop. For free.</div>
      `;
      return { in: tl => {
        tl.from(root.querySelector('.caption'), { opacity: 0, duration: 0.3, ease: 'power2.out' }, 0);
        tl.from(root.querySelectorAll('.headline:nth-child(2) .w'),
          { y: 50, opacity: 0, duration: 0.55, stagger: 0.05, ease: 'power3.out' }, 0.15);
        tl.from(root.querySelector('.headline.green'),
          { y: 30, opacity: 0, scale: 0.9, duration: 0.6, ease: 'back.out(1.6)', transformOrigin: 'center' }, 0.9);
        tl.from(root.querySelector('.headline.tiny'),
          { y: 20, opacity: 0, duration: 0.5, ease: 'power2.out' }, 1.4);
      }};
    },

    // 1 — Here's how (terminal typing)
    (root) => {
      root.innerHTML = `
        <div class="caption">// the build</div>
        <div class="headline mono green" id="typer">_</div>
      `;
      const el = root.querySelector('#typer');
      const target = "$ here's how";
      return { in: tl => {
        tl.from(root.querySelector('.caption'), { opacity: 0, duration: 0.3 }, 0);
        const t = { i: 0 };
        tl.to(t, { i: target.length, duration: 0.7, ease: 'none',
          onUpdate: () => { el.innerHTML = target.slice(0, Math.round(t.i)) + '<span class="cursor green"></span>'; }
        }, 0.2);
      }};
    },

    // 2 — The skill: topic → mp4
    (root) => {
      root.innerHTML = `
        <div class="caption">// the skill</div>
        <div class="headline small">An <span class="green">open source</span> skill.</div>
        <div style="display:flex; align-items:center; gap:40px; margin-top:44px;">
          <div style="border:1.5px solid var(--line); border-radius:12px; padding:24px 32px; font-family:'SF Mono', monospace; font-size:18px; color:var(--muted); background: var(--panel);">
            <span class="muted">$ </span><span class="cyan">topic</span> <span class="green">"quantum computing"</span>
          </div>
          <div style="font-size:32px; color:var(--orange);">→</div>
          <div style="border:1.5px solid var(--green); border-radius:12px; padding:24px 32px; font-family:'SF Mono', monospace; font-size:20px; color:var(--green); background: var(--panel);">
            video.mp4
          </div>
        </div>
        <div class="subhead" style="margin-top:36px;">The agent does four things.</div>
      `;
      return { in: tl => {
        tl.from(root.querySelector('.caption'), { opacity: 0, duration: 0.3 }, 0);
        tl.from(root.querySelector('.headline'), { y: 30, opacity: 0, duration: 0.55, ease: 'power3.out' }, 0.15);
        const flow = root.querySelector('.headline').nextElementSibling;
        tl.from(flow.children[0], { x: -30, opacity: 0, duration: 0.5, ease: 'power2.out' }, 0.5);
        tl.from(flow.children[1], { opacity: 0, scale: 0.5, duration: 0.4, ease: 'back.out(1.6)' }, 0.85);
        tl.from(flow.children[2], { x: 30, opacity: 0, duration: 0.5, ease: 'power2.out' }, 1.0);
        tl.from(root.querySelector('.subhead'), { y: 20, opacity: 0, duration: 0.5, ease: 'power2.out' }, 1.4);
      }};
    },

    // 3 — Step 1: Script (green)
    (root) => {
      root.innerHTML = `
        <div class="step-row">
          <div class="step-num green">01</div>
          <div class="step-body">
            <div class="step-title">Write the script.</div>
            <div class="step-desc">A short narration tailored to the topic. <span class="green">Written by the agent.</span></div>
          </div>
        </div>
        <div style="width:100%; max-width:600px; margin-top:32px; padding:20px 28px; background:var(--panel); border:1px solid var(--line); border-radius:10px; font-family:'SF Mono', monospace; font-size:16px; line-height:1.7; color:var(--muted);">
          <div><span class="muted">&gt;</span> What if a computer could be in two places at once?</div>
          <div><span class="muted">&gt;</span> That's quantum computing.</div>
          <div><span class="muted">&gt;</span> <span class="cursor green" style="margin-left:0;"></span></div>
        </div>
      `;
      return { in: tl => {
        tl.from(root.querySelector('.step-num'), { x: -40, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0);
        tl.from(root.querySelectorAll('.step-title, .step-desc'), { y: 20, opacity: 0, duration: 0.45, stagger: 0.1, ease: 'power2.out' }, 0.2);
        const lines = root.querySelectorAll('[style*="SF Mono"] > div');
        tl.from(lines, { opacity: 0, x: -10, duration: 0.3, stagger: 0.18, ease: 'power2.out' }, 0.6);
      }};
    },

    // 4 — Step 2: HTML (cyan) — THE differentiator, show proof
    (root) => {
      root.innerHTML = `
        <div class="step-row">
          <div class="step-num cyan">02</div>
          <div class="step-body">
            <div class="step-title">Write a custom HTML page.</div>
            <div class="step-desc">A <span class="cyan">fresh design</span> for every topic. No fixed templates.</div>
          </div>
        </div>
        <div class="preview-row">
          <div class="preview" style="background:#0b1230;">
            <div class="label cyan">QUANTUM</div>
            <svg viewBox="0 0 100 80">
              <circle cx="50" cy="40" r="26" fill="none" stroke="#b388ff" stroke-width="1.5"/>
              <ellipse cx="50" cy="40" rx="26" ry="10" fill="none" stroke="#00b8ff" stroke-width="1"/>
              <ellipse cx="50" cy="40" rx="10" ry="26" fill="none" stroke="#00b8ff" stroke-width="1"/>
              <circle cx="50" cy="40" r="3" fill="#fff"/>
            </svg>
            <div class="name purple">|0⟩ + |1⟩</div>
          </div>
          <div class="preview" style="background:#0d1a12;">
            <div class="label green">CRISPR</div>
            <svg viewBox="0 0 100 80">
              <path d="M 20 20 Q 50 40 80 20 Q 50 50 20 60 Q 50 50 80 60" fill="none" stroke="#00ff88" stroke-width="1.5"/>
              <circle cx="32" cy="32" r="2.5" fill="#00ff88"/>
              <circle cx="68" cy="32" r="2.5" fill="#00ff88"/>
              <circle cx="32" cy="58" r="2.5" fill="#00ff88"/>
              <circle cx="68" cy="58" r="2.5" fill="#00ff88"/>
            </svg>
            <div class="name green">DNA</div>
          </div>
          <div class="preview" style="background:#1a1108;">
            <div class="label orange">FINANCE</div>
            <svg viewBox="0 0 100 80">
              <polyline points="15,60 30,52 45,40 60,28 80,12" fill="none" stroke="#ffb347" stroke-width="2"/>
              <circle cx="80" cy="12" r="3" fill="#ffb347"/>
              <line x1="15" y1="65" x2="85" y2="65" stroke="#ffb347" stroke-width="0.5" opacity="0.5"/>
            </svg>
            <div class="name orange">↑ growth</div>
          </div>
          <div class="preview" style="background:#1a0c12;">
            <div class="label pink">HISTORY</div>
            <svg viewBox="0 0 100 80">
              <rect x="22" y="18" width="56" height="44" fill="none" stroke="#ff4d8d" stroke-width="1.5"/>
              <line x1="30" y1="30" x2="70" y2="30" stroke="#ff4d8d" stroke-width="0.8"/>
              <line x1="30" y1="40" x2="65" y2="40" stroke="#ff4d8d" stroke-width="0.8"/>
              <line x1="30" y1="50" x2="68" y2="50" stroke="#ff4d8d" stroke-width="0.8"/>
            </svg>
            <div class="name pink">archive</div>
          </div>
        </div>
      `;
      return { in: tl => {
        tl.from(root.querySelector('.step-num'), { x: -40, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0);
        tl.from(root.querySelectorAll('.step-title, .step-desc'), { y: 20, opacity: 0, duration: 0.45, stagger: 0.1, ease: 'power2.out' }, 0.2);
        tl.from(root.querySelectorAll('.preview'), { y: 30, opacity: 0, duration: 0.5, stagger: 0.13, ease: 'back.out(1.3)' }, 0.55);
      }};
    },

    // 5 — Step 3: TTS (pink)
    (root) => {
      root.innerHTML = `
        <div class="step-row">
          <div class="step-num pink">03</div>
          <div class="step-body">
            <div class="step-title">Generate the voiceover.</div>
            <div class="step-desc">Microsoft Edge TTS — Azure-grade neural voice.<br/>
              <span class="pink">No API key. No account.</span></div>
          </div>
        </div>
        <div class="wave" id="wave"></div>
      `;
      const wave = root.querySelector('#wave');
      for (let i = 0; i < 44; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = '20px';
        wave.appendChild(bar);
      }
      return { in: tl => {
        tl.from(root.querySelector('.step-num'), { x: -40, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0);
        tl.from(root.querySelectorAll('.step-title, .step-desc'), { y: 20, opacity: 0, duration: 0.45, stagger: 0.1, ease: 'power2.out' }, 0.2);
        const bars = wave.querySelectorAll('.bar');
        tl.from(bars, { scaleY: 0, opacity: 0, duration: 0.3, stagger: 0.012, ease: 'power2.out', transformOrigin: 'center' }, 0.55);
        bars.forEach((b, idx) => {
          gsap.to(b, {
            height: () => 16 + Math.random() * 70,
            duration: 0.3 + Math.random() * 0.4,
            repeat: -1, yoyo: true, ease: 'sine.inOut', delay: idx * 0.035,
          });
        });
      }};
    },

    // 6 — Step 4: Render (orange)
    (root) => {
      root.innerHTML = `
        <div class="step-row">
          <div class="step-num orange">04</div>
          <div class="step-body">
            <div class="step-title">Render & merge.</div>
            <div class="step-desc">A headless browser captures the animation.<br/>
              <span class="mono orange">ffmpeg</span> muxes in the voiceover.</div>
          </div>
        </div>
        <div class="pipe">
          <div class="node">page.html</div>
          <div class="arr">→</div>
          <div class="node">chromium</div>
          <div class="arr">→</div>
          <div class="node">raw.webm</div>
          <div class="arr">→</div>
          <div class="node">ffmpeg</div>
          <div class="arr">→</div>
          <div class="node" style="border-color:var(--orange); color:var(--orange);">video.mp4</div>
        </div>
      `;
      return { in: tl => {
        tl.from(root.querySelector('.step-num'), { x: -40, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0);
        tl.from(root.querySelectorAll('.step-title, .step-desc'), { y: 20, opacity: 0, duration: 0.45, stagger: 0.1, ease: 'power2.out' }, 0.2);
        tl.from(root.querySelectorAll('.pipe > *'), { x: -16, opacity: 0, duration: 0.32, stagger: 0.09, ease: 'power2.out' }, 0.55);
      }};
    },

    // 7 — Manifesto
    (root) => {
      root.innerHTML = `
        <div class="caption">// the principles</div>
        <div class="headline small">Runs on your machine.</div>
        <div class="pill-row">
          <div class="pill green">No subscription</div>
          <div class="pill cyan">No watermark</div>
          <div class="pill pink">No limit</div>
        </div>
      `;
      return { in: tl => {
        tl.from(root.querySelector('.caption'), { opacity: 0, duration: 0.3 }, 0);
        tl.from(root.querySelector('.headline'), { y: 30, opacity: 0, duration: 0.55, ease: 'power3.out' }, 0.15);
        tl.from(root.querySelectorAll('.pill'), { y: 20, opacity: 0, scale: 0.9, duration: 0.4, stagger: 0.13, ease: 'back.out(1.5)' }, 0.5);
      }};
    },

    // 8 — Universal: real agent harnesses
    (root) => {
      root.innerHTML = `
        <div class="caption">// model agnostic</div>
        <div class="headline small">Works with any agent.</div>
        <div class="logo-row">
          <div class="logo-chip">claude-code</div>
          <div class="logo-chip">codex</div>
          <div class="logo-chip">cursor</div>
          <div class="logo-chip muted" style="color:var(--muted); border-style:dashed;">+ any CLI</div>
        </div>
      `;
      return { in: tl => {
        tl.from(root.querySelector('.caption'), { opacity: 0, duration: 0.3 }, 0);
        tl.from(root.querySelector('.headline'), { y: 30, opacity: 0, duration: 0.55, ease: 'power3.out' }, 0.15);
        tl.from(root.querySelectorAll('.logo-chip'), { y: 24, opacity: 0, duration: 0.4, stagger: 0.11, ease: 'back.out(1.4)' }, 0.5);
      }};
    },

    // 9 — CTA
    (root) => {
      root.innerHTML = `
        <div class="headline" style="font-size:60px;">Link below.</div>
        <div class="headline green" style="margin-top:14px; font-size:72px;">Make something.<span class="cursor green"></span></div>
      `;
      return { in: tl => {
        tl.from(root.querySelectorAll('.headline'), { y: 40, opacity: 0, duration: 0.55, stagger: 0.22, ease: 'power3.out' });
      }};
    },
  ];

  async function play() {
    let elapsed = 0;
    for (let i = 0; i < scenes.length; i++) {
      topright.textContent = 'SCENE ' + pad(i + 1) + ' / ' + pad(scenes.length);
      const root = document.createElement('div');
      root.className = 'scene';
      stage.appendChild(root);
      const handle = scenes[i](root);
      const segDur = SEG[i] || 5;
      gsap.to(progressEl, { width: ((elapsed + segDur) / TOTAL * 100) + '%', duration: segDur, ease: 'none' });
      requestAnimationFrame(() => root.classList.add('active'));
      const tl = gsap.timeline();
      handle.in(tl);
      await tl.then();
      const used = tl.duration() * 1000;
      const hold = Math.max(0, segDur * 1000 - used - 350);
      await new Promise(r => setTimeout(r, hold));
      const out = gsap.timeline();
      out.to(root.children, { opacity: 0, y: -14, duration: 0.32, ease: 'power2.in', stagger: 0.02 });
      await out.then();
      root.remove();
      elapsed += segDur;
    }
    window.__done = true;
  }

  window.addEventListener('load', () => setTimeout(play, 300));
</script>
</body>
</html>
