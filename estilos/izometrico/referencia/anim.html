<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'SpaceGrotesk';font-weight:700;src:url(../../fuentes/space-grotesk-700.ttf) format('truetype');}
@font-face{font-family:'SpaceGrotesk';font-weight:500;src:url(../../fuentes/space-grotesk-500.ttf) format('truetype');}
html,body{margin:0;background:#f4efe6}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// IZOMETRIK — "El viaje de un mensaje". Mundo miniatura isométrico (proyección 2:1):
// el mensaje salta del teléfono a la torre, cruza el mar por el cable y aterriza
// en el centro de datos con un pop "ENTREGADO". 9 s, 100% determinista.
const W = 1920, H = 1080, DUR = 9;
window.DUR = DUR;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- paleta ----------
const BG = '#f4efe6', INK = '#26332f', SUB = '#5a6b62';
const TEAL  = { t:'#2aa793', l:'#0f766e', r:'#0a4f48' };
const CORAL = { t:'#f0876f', l:'#e8604c', r:'#b23f2e' };
const MUST  = { t:'#f6cf4d', l:'#eab308', r:'#b08705' };
const CREAM = { t:'#fbf7ef', l:'#e8e0d0', r:'#cfc4ae' };
const SLATE = { t:'#5c6773', l:'#3d4650', r:'#272e36' };
const SEA   = { t:'#8fc7ee', l:'#5d9bd6', r:'#3d74ae' };
const BLUE = '#2f6fb2', MUSTD = '#b89007';

// ---------- utilidades ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ez = p => 1 - Math.pow(1 - p, 3);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = (p, s = 1.7) => { p = clamp(p, 0, 1); return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
const tri = u => Math.abs(((u % 2) + 2) % 2 - 1);

// proyección isométrica 2:1 (ejes a 30°), K = escala
const K = 0.8;
const P = (x, y, z) => [(x - y) * K, (x + y) * K * 0.5 - z * K];
const gc = (x, y, w, d) => [(x + w / 2 - (y + d / 2)) * K, (x + w / 2 + y + d / 2) * K * 0.5];
const quadP = (A, C, B, u) => [(1 - u) * (1 - u) * A[0] + 2 * u * (1 - u) * C[0] + u * u * B[0],
                               (1 - u) * (1 - u) * A[1] + 2 * u * (1 - u) * C[1] + u * u * B[1]];
// caída escalonada con overshoot: lift = altura extra sobre el destino
const fall = (t, t0, i, st = 0.12, dur = 0.55) => {
  const p = seg(t, t0 + i * st, t0 + i * st + dur);
  return { lift: (1 - back(p)) * 280, a: seg(p, 0, 0.35), p };
};

function poly(pts, fill, alpha = 1) {
  if (alpha <= 0) return;
  ctx.globalAlpha = alpha; ctx.beginPath();
  pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = fill; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;
}
// bloque isométrico: cima clara, cara izquierda media, derecha oscura
function cube(x, y, z, w, d, h, C, lift = 0, a = 1) {
  const q = (px, py, pz) => P(px, py, pz + lift);
  poly([q(x, y + d, z), q(x + w, y + d, z), q(x + w, y + d, z + h), q(x, y + d, z + h)], C.l, a);
  poly([q(x + w, y, z), q(x + w, y + d, z), q(x + w, y + d, z + h), q(x + w, y, z + h)], C.r, a);
  poly([q(x, y, z + h), q(x + w, y, z + h), q(x + w, y + d, z + h), q(x, y + d, z + h)], C.t, a);
}
function shadow(x, y, r, p) {
  if (p <= 0) return;
  const k = 0.65 + 0.35 * p;
  ctx.globalAlpha = 0.13 * p; ctx.fillStyle = '#8a7f6d';
  ctx.beginPath(); ctx.ellipse(x, y, r * k, r * 0.42 * k, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function edge(pts) {
  ctx.strokeStyle = MUST.l; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
  pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke();
}

// ---------- estación: teléfono ----------
function stPhone(t) {
  ctx.save(); ctx.translate(430, 730);
  const fp = fall(t, 0.15, 0, 0, 0.55);
  shadow(0, 26, 212, fp.p);
  cube(-150, -150, -30, 300, 300, 30, CREAM, fp.lift, fp.a);
  if (fp.p > 0.9) edge([P(-150, 150, 0), P(150, 150, 0), P(150, -150, 0)]);
  const fa = fall(t, 0.55, 0, 0, 0.5), fb = fall(t, 0.55, 1, 0.12, 0.5), fc = fall(t, 0.55, 2, 0.24, 0.5);
  shadow(gc(-128, -8, 44, 44)[0], gc(-128, -8, 44, 44)[1] + 4, 32, fa.p);
  cube(-128, -8, 0, 44, 44, 44, TEAL, fa.lift, fa.a);
  shadow(gc(28, -118, 42, 42)[0], gc(28, -118, 42, 42)[1] + 4, 30, fb.p);
  cube(28, -118, 0, 42, 42, 42, MUST, fb.lift, fb.a);
  shadow(gc(-64, 62, 32, 32)[0], gc(-64, 62, 32, 32)[1] + 4, 28, fc.p);
  cube(-48, 78, 0, 16, 16, 22, SLATE, fc.lift, fc.a);
  cube(-64, 62, 22, 32, 32, 20, TEAL, fc.lift, fc.a);
  cube(-54, 72, 42, 22, 22, 15, TEAL, fc.lift, fc.a);
  const fh = fall(t, 0.38, 0, 0, 0.55);
  const dip = Math.sin(clamp(seg(t, 2.02, 2.38), 0, 1) * Math.PI) * 7;  // anticipación
  shadow(0, 12, 96, fh.p);
  cube(-75, -38, 0, 150, 76, 14, SLATE, fh.lift - dip, fh.a);
  if (fh.p > 0.85) {
    const c = P(0, 0, 14), k = 0.8;
    const cs = [[-75, -38], [75, -38], [75, 38], [-75, 38]].map(q => {
      const p = P(q[0], q[1], 14); return [c[0] + (p[0] - c[0]) * k, c[1] + (p[1] - c[1]) * k];
    });
    poly(cs, '#fdfaf3');
    const hb = P(0, 27, 14);
    ctx.beginPath(); ctx.arc(hb[0], hb[1], 3.5, 0, 7); ctx.fillStyle = '#b9c4bd'; ctx.fill();
    if (t > 1.7 && t < 2.35) for (let i = 0; i < 3; i++) {           // puntos "escribiendo"
      ctx.globalAlpha = 0.35 + 0.65 * ((Math.sin(t * 6 - i * 0.9) + 1) / 2);
      ctx.fillStyle = CORAL.l; ctx.beginPath();
      const dp = P(-20 + i * 20, -6, 14.5); ctx.arc(dp[0], dp[1], 4, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
// ---------- estación: torre ----------
function stTower(t) {
  ctx.save(); ctx.translate(1330, 730);
  const f = [fall(t, 0.3, 0, 0, 0.5), fall(t, 0.3, 1, 0.13, 0.5), fall(t, 0.3, 2, 0.26, 0.5), fall(t, 0.3, 3, 0.39, 0.5)];
  shadow(0, 28, 132, f[0].p);
  cube(-80, -80, -34, 160, 160, 34, CREAM, f[0].lift, f[0].a);
  cube(-46, -46, 0, 92, 92, 168, TEAL, f[1].lift, f[1].a);
  if (f[1].p > 0.9) {
    poly([P(-28, 46, 60), P(-4, 46, 60), P(-4, 46, 88), P(-28, 46, 88)], 'rgba(251,247,239,0.85)');
    poly([P(8, 46, 60), P(32, 46, 60), P(32, 46, 88), P(8, 46, 88)], 'rgba(251,247,239,0.85)');
  }
  cube(-62, -62, 168, 124, 124, 26, MUST, f[2].lift, f[2].a);
  cube(-8, -8, 194, 16, 16, 96, SLATE, f[3].lift, f[3].a);
  if (f[3].p > 0.85) {                                              // luz parpadeante
    const lp = P(0, 0, 298), boost = Math.sin(clamp(seg(t, 3.35, 3.95), 0, 1) * Math.PI);
    const on = ((t * 1.35) % 1 < 0.24) ? 1 : 0.4, R = 26 + 10 * on + 14 * boost;
    const g = ctx.createRadialGradient(lp[0], lp[1], 1, lp[0], lp[1], R);
    g.addColorStop(0, 'rgba(232,96,76,' + (0.45 + 0.4 * on) + ')'); g.addColorStop(1, 'rgba(232,96,76,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lp[0], lp[1], R, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(lp[0], lp[1], 7.5 + 2.5 * on + 3 * boost, 0, 7); ctx.fillStyle = CORAL.l; ctx.fill();
    for (let k = 0; k < 2; k++) {
      const rp = ((t * 1.35 + k * 0.5) % 1);
      ctx.beginPath(); ctx.arc(lp[0], lp[1], 12 + rp * 34, 0, 7);
      ctx.strokeStyle = 'rgba(232,96,76,' + ((1 - rp) * 0.45) + ')'; ctx.lineWidth = 2.5; ctx.stroke();
    }
  }
  ctx.restore();
}
// ---------- placa del mar ----------
function stSea(t) {
  const sp = seg(t, 1.15, 1.8); if (sp <= 0) return;
  const yo = (1 - ez(sp)) * 190 + Math.sin(t * 1.3) * 4 * seg(t, 1.8, 2.2);
  ctx.save(); ctx.translate(0, yo);
  const x0 = 1990, x1 = 3050, ym = 806, w = 54, e = 110, T = 26;
  const hex = [[x0, ym], [x0 + e, ym - w], [x1 - e, ym - w], [x1, ym], [x1 - e, ym + w], [x0 + e, ym + w]];
  poly(hex, SEA.t);
  poly([[x0, ym], [x0 + e, ym + w], [x0 + e, ym + w + T], [x0, ym + T]], SEA.l);
  poly([[x1, ym], [x1 - e, ym + w], [x1 - e, ym + w + T], [x1, ym + T]], SEA.r);
  if (sp > 0.7) {                                                   // olas sinusoidales
    ctx.save(); ctx.beginPath();
    hex.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath(); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let r = 0; r < 4; r++) {
      ctx.beginPath();
      for (let x = x0 + e; x <= x1 - e; x += 18) {
        const y = ym - 34 + r * 22.6 + Math.sin(x * 0.02 + t * 1.7 + r * 1.7) * 6;
        x === x0 + e ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  if (sp > 0.9) {                                                   // velero
    const bx = 2110 + tri(t * 0.11) * 690;
    ctx.save(); ctx.translate(bx, ym + Math.sin(t * 2.1) * 3);
    poly([[-16, 0], [16, 0], [10, 8], [-10, 8]], '#3d4650');
    poly([[0, -2], [0, -26], [16, -4]], CORAL.l);
    ctx.restore();
  }
  ctx.restore();
}
// ---------- estación: servidores ----------
function stServer(t) {
  ctx.save(); ctx.translate(3400, 760);
  const f = [fall(t, 0.9, 0, 0, 0.6), fall(t, 0.9, 1, 0.14, 0.6), fall(t, 0.9, 2, 0.28, 0.55),
             fall(t, 0.9, 3, 0.42, 0.5), fall(t, 0.9, 4, 0.56, 0.45)];
  shadow(0, 28, 226, f[0].p);
  cube(-160, -120, -30, 320, 240, 30, CREAM, f[0].lift, f[0].a);
  if (f[0].p > 0.9) edge([P(-160, 120, 0), P(160, 120, 0), P(160, -120, 0)]);
  cube(-100, -70, 0, 200, 140, 150, TEAL, f[1].lift, f[1].a);
  cube(-108, -78, 150, 216, 156, 16, MUST, f[2].lift, f[2].a);
  poly([P(-20, 70, 0), P(20, 70, 0), P(20, 70, 50), P(-20, 70, 50)], '#e8e0d0', f[1].p);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) {          // ventanas cara derecha
    const y = -42 + i * 32, z = 60 + j * 36;
    poly([P(100, y, z), P(100, y + 18, z), P(100, y + 18, z + 20), P(100, y, z + 20)], 'rgba(251,247,239,0.8)', f[1].p);
  }
  if (f[1].p > 0.85) {                                              // LEDs en secuencia
    const spd = (t > 6.45 && t < 7.95) ? 13 : 6;
    for (let i = 0; i < 6; i++) for (let j = 0; j < 3; j++) {
      const pos = P(-78 + i * 31, 70, 64 + j * 26);
      const b = (Math.sin(t * spd - i * 1.05 - j * 0.55) + 1) / 2;
      ctx.globalAlpha = 0.15 + 0.85 * clamp((b - 0.35) / 0.3, 0, 1);
      ctx.fillStyle = [MUST.t, CORAL.l, '#fbf7ef'][(i + j) % 3];
      ctx.beginPath(); ctx.arc(pos[0], pos[1], 5.5, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  cube(-5, -5, 166, 10, 10, 70, SLATE, f[3].lift, f[3].a);
  cube(-26, -20, 166, 52, 40, 12, SLATE, f[4].lift, f[4].a);
  const hp = Math.sin(clamp(seg(t, 6.35, 6.8), 0, 1) * Math.PI);    // destello de escotilla
  if (hp > 0) poly([P(-26, -20, 178), P(26, -20, 178), P(26, 20, 178), P(-26, 20, 178)], MUST.t, hp * 0.85);
  if (t > 6.5 && t < 7.95) {                                        // "procesando": anillos y burbujitas
    const mp = P(0, 0, 238);
    for (let k = 0; k < 2; k++) {
      const u = ((t * 1.5 + k * 0.5) % 1);
      ctx.beginPath(); ctx.arc(mp[0], mp[1], 10 + u * 26, 0, 7);
      ctx.strokeStyle = 'rgba(234,179,8,' + ((1 - u) * 0.6) + ')'; ctx.lineWidth = 2.5; ctx.stroke();
    }
    for (let k = 0; k < 3; k++) {
      const u = ((t * 0.8 + k / 3) % 1);
      ctx.globalAlpha = (1 - u) * 0.7; ctx.fillStyle = k % 2 ? CORAL.l : MUST.l;
      ctx.beginPath(); ctx.arc((k - 1) * 26, -150 - u * 135, 4 + u * 3, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
// cable de la torre al centro de datos, con impulsos que viajan
const CAB = { A: [1330, 489], C: [2365, 700], B: [3400, 571] };
function cable(t) {
  const p = seg(t, 3.35, 3.85); if (p <= 0) return;
  const n = Math.max(2, Math.round(44 * ez(p)));
  ctx.beginPath();
  for (let i = 0; i <= n; i++) { const q = quadP(CAB.A, CAB.C, CAB.B, i / n); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }
  ctx.strokeStyle = '#3f4d47'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.stroke();
  if (p >= 1) {
    ctx.save(); ctx.setLineDash([5, 27]); ctx.lineDashOffset = -t * 130;
    ctx.strokeStyle = MUST.l; ctx.lineWidth = 3.5; ctx.stroke(); ctx.restore();
  }
}

// ---------- el mensaje (burbuja) ----------
const B0 = [430, 706], BC = [850, 392], B1 = [1330, 489], HAT = [3400, 618];
function bpos(t) {
  if (t < 1.75) return null;
  if (t < 2.3) return { x: B0[0], y: B0[1], r: 13 * back(seg(t, 1.75, 2.15)) };
  if (t < 3.35) { const q = quadP(B0, BC, B1, eio(seg(t, 2.3, 3.35))); return { x: q[0], y: q[1], r: 13 + 9 * seg(t, 2.3, 2.6) }; }
  if (t < 3.8) return { x: B1[0], y: B1[1] + Math.sin(t * 6) * 4, r: 22 };
  if (t < 6.1) { const q = quadP(CAB.A, CAB.C, CAB.B, eio(seg(t, 3.8, 6.1))); return { x: q[0], y: q[1] - Math.sin(t * 5.2) * 7, r: 22 }; }
  if (t < 6.5) { const u = seg(t, 6.1, 6.45); return { x: 3400, y: CAB.B[1] + (HAT[1] - CAB.B[1]) * u, r: 22 * (1 - u) }; }
  if (t >= 7.9 && t < 8.25) { const u = eio(seg(t, 7.9, 8.25)); return { x: 3400, y: 600 - 270 * u, r: 6 + 18 * seg(t, 7.9, 8.1) }; }
  return null;
}
function drawBubble(t) {
  const b = bpos(t); if (!b || b.r < 0.5) return;
  const pb = bpos(t - 0.07);
  ctx.save(); ctx.translate(b.x, b.y);
  if (pb && t > 2.3 && t < 6.5) {                                   // colita según dirección
    const ang = Math.atan2(b.y - pb.y, b.x - pb.x);
    ctx.save(); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(-b.r + 3, 0); ctx.lineTo(-b.r - 12, -6.5); ctx.lineTo(-b.r - 12, 6.5);
    ctx.closePath(); ctx.fillStyle = CORAL.l; ctx.fill(); ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 7);
  ctx.fillStyle = CORAL.l; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = '#fbf7ef'; ctx.stroke();
  if (b.r > 9) { ctx.beginPath(); ctx.arc(-b.r * 0.34, -b.r * 0.34, b.r * 0.22, 0, 7); ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill(); }
  ctx.restore();
}
function shards(t) {                                                // pop: fragmentos
  const p = seg(t, 8.22, 8.85); if (p <= 0 || p >= 1) return;
  const e = ez(p);
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2 + 0.35, d = e * (60 + (i % 3) * 16);
    ctx.save(); ctx.translate(3400 + Math.cos(a) * d, 318 + Math.sin(a) * d * 0.8);
    ctx.rotate(a + e * 2.2); ctx.globalAlpha = 1 - p;
    ctx.fillStyle = [CORAL.l, MUST.l, TEAL.t][i % 3];
    ctx.beginPath(); ctx.moveTo(-7, -5); ctx.lineTo(9, 0); ctx.lineTo(-7, 5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function badge(t) {                                                 // sello ENTREGADO
  const bp = seg(t, 8.22, 8.75); if (bp <= 0) return;
  ctx.save(); ctx.translate(3400, 318); ctx.rotate(-0.05);
  const s = back(bp); ctx.scale(s, s); ctx.globalAlpha = clamp(bp * 2.2, 0, 1);
  rr(-196, -56, 392, 112, 26);
  ctx.fillStyle = MUST.l; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
  ctx.beginPath(); ctx.arc(-138, 0, 25, 0, 7); ctx.fillStyle = INK; ctx.fill();
  const ck = seg(t, 8.5, 8.85);
  if (ck > 0) {
    ctx.strokeStyle = '#fbf7ef'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-150, 1); ctx.lineTo(-142, 10);
    if (ck > 0.5) ctx.lineTo(-126, -9); ctx.stroke();
  }
  ctx.fillStyle = INK; ctx.font = '700 46px SpaceGrotesk'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('ENTREGADO', -98, 2);
  ctx.restore(); ctx.globalAlpha = 1;
  const cp = seg(t, 8.55, 8.95);
  if (cp > 0) {
    ctx.globalAlpha = cp; ctx.fillStyle = SUB; ctx.font = '500 28px SpaceGrotesk';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('09:41 · MENSAJE RECIBIDO', 3400, 404); ctx.globalAlpha = 1;
  }
}
// etiqueta técnica: chip + línea guía discontinua
function chip(txt, num, x, y, tx, ty, t0, t, col) {
  const p = seg(t, t0, t0 + 0.45); if (p <= 0) return;
  ctx.font = '700 28px SpaceGrotesk';
  const w = ctx.measureText(txt).width + 96, h = 52, a = clamp(p * 1.8, 0, 1);
  const dx = tx - x, dy = ty - y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  ctx.save(); ctx.globalAlpha = a * 0.95;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.5; ctx.setLineDash([8, 7]);
  ctx.beginPath(); ctx.moveTo(x + ux * (w / 2 - 6), y + uy * 22); ctx.lineTo(tx - ux * 8, ty - uy * 8); ctx.stroke();
  ctx.setLineDash([]); ctx.beginPath(); ctx.arc(tx, ty, 4.5, 0, 7); ctx.fill();
  ctx.translate(x, y); const s = 0.6 + 0.4 * back(p); ctx.scale(s, s);
  rr(-w / 2, -h / 2, w, h, 14);
  ctx.fillStyle = 'rgba(253,250,243,0.95)'; ctx.fill(); ctx.strokeStyle = col; ctx.stroke();
  rr(-w / 2 + 8, -h / 2 + 8, 36, 36, 9); ctx.fillStyle = col; ctx.fill();
  ctx.fillStyle = '#fbf7ef'; ctx.font = '700 23px SpaceGrotesk'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(num, -w / 2 + 26, 2);
  ctx.fillStyle = INK; ctx.font = '700 28px SpaceGrotesk'; ctx.textAlign = 'left';
  ctx.fillText(txt, -w / 2 + 58, 1);
  ctx.restore(); ctx.globalAlpha = 1;
}
function deco(x, y, sz, C, t, ph) {                                 // cubos flotantes de ambiente
  ctx.save(); ctx.translate(x, y + Math.sin(t * 1.05 + ph) * 9);
  cube(-sz / 2, -sz / 2, 0, sz, sz, sz, C); ctx.restore();
}

// ---------- HUD ----------
const TITLE = 'EL VIAJE DE UN MENSAJE';
const SUBT = 'UN MENSAJE VIAJA DEL TELÉFONO AL CENTRO DE DATOS';
function hud(t) {
  const tp = seg(t, 0.25, 0.85);
  if (tp > 0) {
    ctx.save(); ctx.translate(960, 94); const s = 0.7 + 0.3 * back(tp);
    ctx.scale(s, s); ctx.globalAlpha = clamp(tp * 1.4, 0, 1);
    ctx.font = '700 66px SpaceGrotesk'; ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(TITLE, 0, 0);
    const uw = ez(seg(t, 0.55, 1.2)) * 560;
    ctx.fillStyle = TEAL.l; ctx.fillRect(-280, 34, uw, 7);
    if (uw > 2) { ctx.fillStyle = MUST.l; ctx.beginPath(); ctx.arc(-280 + uw, 37.5, 8, 0, 7); ctx.fill(); }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  const su = seg(t, 1.0, 2.3);
  if (su > 0) {
    const n = Math.round(ez(su) * SUBT.length), vis = SUBT.slice(0, n);
    ctx.globalAlpha = clamp(su * 2, 0, 1);
    ctx.font = '500 29px SpaceGrotesk'; ctx.fillStyle = SUB; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(vis, 960, 158);
    if (su < 1 && Math.sin(t * 9) > 0) {
      ctx.fillStyle = TEAL.l; ctx.fillRect(960 + ctx.measureText(vis).width / 2 + 5, 145, 13, 26);
    }
    ctx.globalAlpha = 1;
  }
}

// ---------- cuadro completo ----------
// canvas fillText no dispara la carga de @font-face: hay que pedirla explícitamente
window.ready = Promise.all([
  document.fonts.load('700 20px SpaceGrotesk'),
  document.fonts.load('500 20px SpaceGrotesk')
]).then(() => document.fonts.ready).then(() => {});

window.draw = ({ t }) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const cam = 1730 * eio(seg(t, 3.7, 4.9));                          // paneo lateral entre estaciones
  const fx = Math.sin(t * 0.85) * 5, fy = Math.sin(t * 0.62) * 3.5;

  ctx.fillStyle = 'rgba(15,118,110,0.09)';                           // puntos en parallax
  const po = (cam * 0.3) % 64;
  for (let x = -po; x < W; x += 64) for (let y = 30; y < H; y += 64) {
    ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill();
  }
  ctx.fillStyle = 'rgba(15,118,110,0.05)';                           // manchas suaves de fondo
  ctx.beginPath(); ctx.ellipse(430 - cam * 0.55, 660, 430, 190, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3400 - cam * 0.8, 700, 470, 210, 0, 0, 7); ctx.fill();

  ctx.save(); ctx.translate(-cam + fx, fy);                          // ---- mundo ----
  deco(150, 330, 40, TEAL, t, 0);
  deco(905, 238, 26, CREAM, t, 2.2);
  deco(3560, 185, 32, CORAL, t, 4.1);
  stPhone(t); stTower(t); stSea(t); stServer(t); cable(t);
  drawBubble(t);
  const lr = seg(t, 2.3, 2.8);                                       // anillo de despegue
  if (lr > 0 && lr < 1) {
    ctx.beginPath(); ctx.arc(B0[0], B0[1], 16 + ez(lr) * 44, 0, 7);
    ctx.strokeStyle = 'rgba(232,96,76,' + ((1 - lr) * 0.6) + ')'; ctx.lineWidth = 3; ctx.stroke();
  }
  badge(t); shards(t);
  chip('REDACTAR', '01', 470, 520, 485, 698, 1.85, t, CORAL.l);
  chip('SEÑAL', '02', 1330, 282, 1330, 458, 3.4, t, TEAL.l);
  chip('TRÁNSITO', '03', 2470, 530, 2455, 622, 4.8, t, BLUE);
  chip('ENTREGA', '04', 3040, 428, 3352, 548, 6.2, t, MUSTD);
  ctx.restore();

  hud(t);                                                            // ---- HUD ----
  const g = ctx.createRadialGradient(960, 540, 520, 960, 540, 1260);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(88,70,52,0.15)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  return cv.toDataURL('image/jpeg', 0.92);
};
window.draw({ t: 0 });
</script></body></html>
